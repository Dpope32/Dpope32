    <svg data-testid="icon" class="icon" viewBox="0 0 16 16" version="1.1" width="16" height="16">
      <path d="M8.5 0.5c1.5 3.5-1 4.5-1 6.5 0 .8.4 1.5 1.1 1.9.8-.9 1.6-1.9 1.8-3.4 2.2 1.9 3.1 3.8 3.1 5.7A5.5 5.5 0 0 1 2.5 11c0-3.2 2-5 3.7-7.1-.2 1.9.1 2.8.5 3.3C6.4 3.7 8.4 3.2 8.5.5z"/>
